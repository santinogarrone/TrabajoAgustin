<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>

    <header>
        <nav class="nav-bar">
            <div class="cuadrado-violeta">

    <main>

        <section class="contact">
            <h3>Contacto</h3>
            <p class="p-contact">
                Estamos listos para ayudarte. Completa el formulario y nos pondremos en contacto contigo lo antes posible.

            <form>
                <input type="text" placeholder="Nombre Completo" required>
                <input type="email" placeholder="Correo Eletrónico" required>
               <select name="options" id="tipo-trabajo">
                    <option value="">Selecciona un servicio</option>
                    <option value="marketing">Marketing Digital</option>
                    <option value="d-grafico">Diseño Gráfico</option>
                    <option value="des-web">Desarrollo Web</option>
               </select>
               <textarea placeholder="Tu mensaje" rows=""></textarea>
            </form>
        </section>
