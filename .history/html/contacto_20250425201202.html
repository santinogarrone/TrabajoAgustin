<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/contacto.css">
    <title>Contacto.</title>
</head>
<body>

    <header>
        <nav class="nav-bar">
            <div class="cuadrado-violeta">

            </div>

            
            <button class="menu" aria-label="menu">
                <span class="menu-linea"></span>
                <span class="menu-linea"></span>
                <span class="menu-linea"></span>
            </button>
        </nav>
    </header>

    <main>

        <section class="contact">
            <h3>Contacto</h3>
            <p class="p-contact">
                Estamos listos para ayudarte. Completa el formulario y nos pondremos en contacto contigo lo antes posible.
            </p>

            <form class="formulario">
                <input type="text" placeholder="Nombre Completo" required>
                <input type="email" placeholder="Correo Eletrónico" required>
                <select name="options" id="tipo-trabajo" aria-label="Selecciona un servicio" required>
                    <option value="">Selecciona un servicio</option>
                    <option value="marketing">Marketing Digital</option>
                    <option value="d-grafico">Diseño Gráfico</option>
                    <option value="des-web">Desarrollo Web</option>
               </select>
               <textarea placeholder="Tu mensaje" rows="4" required></textarea>
               <button type="submit" class="boton-enviar">Enviar mensaje</button>
            </form>
        </section>

        <section class="info-add">
            <div class="info">
                <h3 class="titulo-info">Información adicional</h3>
                <ul>
                    <li>Email: contacto@serviciosdigitales.com</li>
                    <li>Teléfono: +1 234 567 890</li>
                    <li></li>
                </ul>
            </div>
        </section>
    </main>
</body>
</html>
